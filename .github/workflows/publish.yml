name: Publish newsroom

# Builds news.radioindex.org from the radioindex.org-blog posts and uploads it to
# Cloudflare Pages as plain static files (no Functions, so no Workers usage).
# Blog posts reach the newsroom through the schedule: every 15 minutes the job
# compares the blog's HEAD with build.json on the live site and publishes only
# when they differ.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [blog-updated]

concurrency:
  group: publish-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: radioindex-news
  DOMAIN: news.radioindex.org
  ZONE: radioindex.org

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the blog
        uses: actions/checkout@v4
        with:
          repository: thearchiveofamericanradio/radioindex.org-blog
          path: blog
          fetch-depth: 0

      - name: Skip when the live newsroom already has this blog commit
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          # Read the pages.dev host: the radioindex.org zone may challenge GitHub runner IPs.
          live=$(curl -sS -A "newsroom-publish" "https://$PROJECT.pages.dev/build.json" | jq -r .blog_sha 2>/dev/null || true)
          head=$(git -C blog rev-parse HEAD)
          echo "live=$live head=$head"
          if [ "$live" = "$head" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and check
        if: steps.fresh.outputs.skip != 'true'
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          npm test

      - name: Upload to Cloudflare Pages
        id: deploy
        if: steps.fresh.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="${{ github.sha }}" --commit-message="blog $(git -C blog rev-parse --short HEAD)" --commit-dirty=true

      - name: Attach news.radioindex.org
        if: steps.deploy.outcome == 'success' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/attach-domain.sh
